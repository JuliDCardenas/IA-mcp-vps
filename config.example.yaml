# Migración a base de datos de aprobación:
# No es necesario ejecutar ningún script de migración estructural en SQLite.
# El nuevo sistema agrega el estado EXECUTING e INDETERMINATE_STATE a los posibles estados de 'status'.
# Los registros existentes en estado 'PENDING' o 'APPROVED' no se ven afectados y conservarán su flujo actual.
# Asegúrate de realizar una copia de seguridad (backup) del archivo approvals.db antes de desplegar.
# IMPORTANTE: Si el worker colapsa o el contenedor se reinicia durante una operación (EXECUTING),
# NO reintentar ciegamente la operación, requiere autorización y reinicio manual.

allowed_containers:
  - homepage

allowed_http_targets:
  homepage_local: "http://host.docker.internal:3001"

tools:
  docker_restart:
    enabled: true
    requires_approval: true
    targets:
      - homepage
