server:
  name: IA MCP VPS
jules:
  db_path: /var/lib/coding-jobs/jules_jobs.db
  observability:
    enabled: true
    output_dir: /var/lib/jules-observability
    interval_seconds: 60
security:
  max_file_bytes: 200000
  max_log_lines: 500
  deny_paths: [/root, /etc/shadow, /etc/sudoers, /home/*/.ssh]
  deny_file_names: [.env, id_rsa, id_ed25519]
allowed_paths:
  gps_stack:
    root: /opt/gps-tracker
    writable: true
    extensions: [.py, .yml, .yaml, .json, .txt, .md, .conf]
allowed_containers: [mosquitto, traccar, subscriber-json-osmand]
allowed_services: [mosquitto, traccar]
