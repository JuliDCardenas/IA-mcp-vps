services:
  ia-mcp-vps:
    build: .
    container_name: ia-mcp-vps
    restart: unless-stopped

    # En el VPS de Julian, /home/ubuntu pertenece a UID/GID 1001.
    # Si tu usuario host tiene otro UID/GID, crea .env con MCP_UID/MCP_GID.
    user: "${MCP_UID:-1001}:${MCP_GID:-1001}"

    # /var/run/docker.sock pertenece al grupo docker del host.
    # En este VPS el grupo docker es GID 999. Si cambia, ajustar MCP_DOCKER_GID en .env.
    group_add:
      - "${MCP_DOCKER_GID:-999}"

    environment:
      IA_MCP_VPS_CONFIG: /config/config.yaml
      IA_MCP_VPS_TRANSPORT: http
      IA_MCP_VPS_HOST: 0.0.0.0
      IA_MCP_VPS_PORT: 8787
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./audit:/app/audit
      - ./backups:/app/backups

      # Stacks del VPS de Julian.
      # Todos viven bajo /home/ubuntu en el host y se exponen bajo /mnt/stacks.
      # No se monta / completo.
      - /home/ubuntu:/mnt/stacks
      - /var/log:/mnt/host-logs:ro

      # Permite consultar/reiniciar contenedores del host.
      # OJO: docker.sock equivale a mucho poder sobre el host; mantener allowlists estrictas.
      - /var/run/docker.sock:/var/run/docker.sock

    # Publicar solo en localhost del host; Caddy hace reverse proxy HTTPS.
    ports:
      - "127.0.0.1:8787:8787"
