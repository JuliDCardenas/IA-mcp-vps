services:
  ia-mcp-vps:
    build: .
    container_name: ia-mcp-vps
    restart: unless-stopped

    # El MCP actual corre por stdio. Sin stdin abierto, el proceso puede terminar
    # y Docker entra en restart loop. Esto mantiene el proceso vivo para pruebas.
    stdin_open: true
    tty: true

    # En el VPS de Julian, /home/ubuntu normalmente pertenece a UID/GID 1000.
    # Correr con ese usuario permite leer los stacks montados sin usar root.
    # Si tu usuario host tiene otro UID/GID, crea .env con MCP_UID/MCP_GID.
    user: "${MCP_UID:-1000}:${MCP_GID:-1000}"

    environment:
      IA_MCP_VPS_CONFIG: /config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./audit:/app/audit
      - ./backups:/app/backups

      # Stacks del VPS de Julian.
      # Todos viven bajo /home/ubuntu en el host y se exponen bajo /mnt/stacks.
      # No se monta / completo.
      - /home/ubuntu:/mnt/stacks
      - /var/log:/mnt/host-logs:ro

      # Permite consultar/reiniciar contenedores del host.
      # OJO: docker.sock equivale a mucho poder sobre el host; mantener allowlists estrictas.
      - /var/run/docker.sock:/var/run/docker.sock

    # No publicar puertos todavía. El transporte remoto MCP se define en una fase posterior.
    # ports:
    #   - "8787:8787"
