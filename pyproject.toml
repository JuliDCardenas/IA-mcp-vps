[project]
name = "ia-mcp-vps"
version = "0.2.0"
description = "MCP server seguro para mantenimiento controlado de VPS"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0.0",
  "PyYAML>=6.0.2",
  "psutil>=6.0.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
